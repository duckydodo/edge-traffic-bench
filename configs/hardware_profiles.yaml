# Hardware profiling configurations for AMD Ryzen 5 7530U (Zen 3, 6C/12T)
# Target: Prevent thread oversubscription & control CPU affinity cleanly across runtimes

hardware:
  cpu_model: "AMD Ryzen 5 7530U with Radeon Graphics"
  architecture: "Zen 3 (x86_64)"
  physical_cores: 6
  logical_cores: 12
  isa_extensions:
    avx2: true
    vnni: false # Zen 3 lacks AVX-VNNI and AVX512-VNNI
  memory_gb: 16
  # Physical core primary hardware threads (excluding SMT siblings 1, 3, 5, 7, 9, 11)
  physical_core_affinity_map: [0, 2, 4, 6, 8, 10]

profiles:
  edge_1c:
    name: "edge_1c"
    description: "Strict single-thread edge profile (1 physical core)"
    num_threads: 1
    cpu_affinity: [0]
    opencv_threads: 1
    env_vars:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    runtime_options:
      intra_op_num_threads: 1
      inter_op_num_threads: 1

  edge_2c:
    name: "edge_2c"
    description: "Dual-thread edge profile (2 isolated physical cores, no SMT collision)"
    num_threads: 2
    cpu_affinity: [0, 2]
    opencv_threads: 1
    env_vars:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      VECLIB_MAXIMUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    runtime_options:
      intra_op_num_threads: 2
      inter_op_num_threads: 1

  full_6c:
    name: "full_6c"
    description: "Full physical capacity (6 physical cores, 1 thread per physical core, avoiding SMT)"
    num_threads: 6
    cpu_affinity: [0, 2, 4, 6, 8, 10]
    opencv_threads: 1
    env_vars:
      OMP_NUM_THREADS: "6"
      MKL_NUM_THREADS: "6"
      OPENBLAS_NUM_THREADS: "6"
      VECLIB_MAXIMUM_THREADS: "6"
      NUMEXPR_NUM_THREADS: "6"
    runtime_options:
      intra_op_num_threads: 6
      inter_op_num_threads: 1

benchmark_defaults:
  warmup_frames: 50
  memory_sample_interval_sec: 0.1 # 10 Hz USS sampling
  confidence_threshold: 0.25
  iou_threshold: 0.45
