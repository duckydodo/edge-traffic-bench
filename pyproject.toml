[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-traffic-bench"
version = "0.1.0"
description = "Rigorous edge benchmarking and profiling harness for object detection and tracking on Zen 3 CPUs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "opencv-python-headless>=4.8.0",
    "ultralytics>=8.3.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "openvino>=2024.0.0",
    "scipy>=1.11.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
edge-traffic-bench = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
